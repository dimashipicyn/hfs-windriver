name: Build Windows 11 HFS+ Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install WinFsp
        shell: pwsh
        run: choco install winfsp -y

      - name: Setup MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        shell: pwsh
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DWINFSP_DIR="C:/Program Files (x86)/WinFsp"

      - name: Build HFS+ Driver and Core Library
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run Unit Tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build/hfsplus.exe dist/
          Copy-Item README.md dist/
          if (Test-Path "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll") {
            Copy-Item "C:\Program Files (x86)\WinFsp\bin\winfsp-x64.dll" dist/
          }
          Compress-Archive -Path dist/* -DestinationPath hfsplus-windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hfsplus-windows-x64
          path: hfsplus-windows-x64.zip

  build-macos:
    name: Build & Test on macOS (Apple Silicon & Clang)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run CTest with ASan & UBSan
        run: ctest --test-dir build --output-on-failure
