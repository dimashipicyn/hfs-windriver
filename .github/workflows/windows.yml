name: Build Windows 11 HFS+ Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: amd64
          - platform: ARM64
            arch: amd64_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install WinFsp
        shell: pwsh
        run: choco install winfsp -y

      - name: Setup MSVC environment (${{ matrix.platform }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure CMake (${{ matrix.platform }})
        shell: pwsh
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DWINFSP_DIR="C:/Program Files (x86)/WinFsp"

      - name: Build HFS+ Driver and Core Library
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run Unit Tests (x64 only)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build/hfsplus.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath hfsplus-windows-${{ matrix.platform }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hfsplus-windows-${{ matrix.platform }}
          path: hfsplus-windows-${{ matrix.platform }}.zip

  build-macos:
    name: Build & Test on macOS (Apple Silicon & Clang)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run CTest with ASan & UBSan
        run: ctest --test-dir build --output-on-failure
